workflows:
  ios-build:
    name: Build iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - api_secrets
      xcode: latest
    scripts:
      - name: Inject API Key
        script: |
          set -e
          sed -i '' "s/SECRET_API_KEY_PLACEHOLDER/$API_FOOTBALL_KEY/g" Shared/FootballAPIService.swift

      - name: Generate Xcode Project
        script: |
          set -e
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned IPA
        script: |
          set -e
          xcodebuild clean build \
            -project FootballLiveApp.xcodeproj \
            -scheme FootballLiveApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH=$(find build -name "FootballLiveApp.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r FootballLiveApp.ipa Payload
    artifacts:
      - FootballLiveApp.ipa
